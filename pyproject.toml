[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-project"
version = "0.1.0"
description = "Production-style FastAPI backend for LLM integration."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "numpy==1.26.4",
    "openai==3.6.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "tenacity==9.1.4",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "isort==9.0.1",
    "pre-commit==4.6.2",
    "pylint==4.0.8",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pylint.main]
py-version = "3.12"
