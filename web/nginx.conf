# nginx edge for the Next.js container. This file is included from
# nginx-main.conf inside the http{} context. Public HTTP terminates on port
# 3000; API traffic is reverse-proxied to the backend microservice, everything
# else is forwarded to the Next.js standalone server on the internal port.

server {
    listen 3000;
    server_name _;

    # All proxying happens over loopback inside this container; the Next.js
    # server owns the upstream backend URL (BACKEND_URL) at request time.

    # API traffic goes through the Next.js server, whose route handler injects
    # the server-side bearer token before calling the backend. Proxying straight
    # to the backend here would bypass the token and get a 401.
    location /api/backend/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # streaming responses must pass through
        proxy_read_timeout 300s;
    }

    # The Next.js standalone output places build assets at /app/.next/static and
    # serves them at the /_next/* URL, so alias (not root) maps the URL to disk.
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}